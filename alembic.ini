; Alembic configuration. Owned by `module/persistence` (PLAN.md §13.2, §13.3).
;
; `sqlalchemy.url` is deliberately EMPTY. The URL comes from `persistence.engine`,
; which reads `$BUDGET_DATABASE_URL` — one place decides which database the application
; and its migrations talk to, so `alembic upgrade head` cannot be pointed at a different
; database than the app by editing a file nobody looks at. Override for a one-off run
; with `alembic -x db_url=sqlite+pysqlite:///scratch.db upgrade head`.

[alembic]
script_location = alembic
prepend_sys_path = .
path_separator = os
sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
